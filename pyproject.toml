[project]
name = "speakup"
version = "0.1.0"
description = "Local voice tutor for practising spoken English"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.40.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
