<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeakUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>SpeakUp</h1>
      <p class="subtitle">zeszyt do mówienia po angielsku</p>
    </header>
    <p id="error" class="error" hidden></p>

    <section id="start-view">
      <h2><span class="step">1</span> Kto dziś ćwiczy?</h2>
      <div id="profile-picker" class="row">
        <select id="profile-select" aria-label="Profil"></select>
        <button id="edit-profile" class="link" type="button">edytuj profil</button>
      </div>
      <form id="new-profile" class="row">
        <input id="new-name" placeholder="albo wpisz imię nowej osoby" maxlength="40" required>
        <button type="submit" class="link">utwórz profil</button>
      </form>

      <div id="topic-box" hidden>
        <h2><span class="step">2</span> O czym rozmawiamy?</h2>
        <div id="topics" class="topics"></div>
        <form id="start-form" class="row">
          <input id="topic" placeholder="własny temat, np. my last weekend" maxlength="80" required>
          <button type="submit">Zaczynamy</button>
        </form>
      </div>
    </section>

    <section id="profile-view" hidden>
      <h2>Profil</h2>
      <form id="profile-form" class="sheet">
        <label><span>Imię</span><input name="name" maxlength="40" required></label>
        <label><span>Poziom</span>
          <select name="level">
            <option>A1</option><option>A2</option><option>B1</option>
            <option>B2</option><option>C1</option><option>C2</option>
          </select>
        </label>
        <label><span>Lubię rozmawiać o</span><textarea name="interests" rows="2"></textarea><small>oddziel przecinkami</small></label>
        <label><span>Mój cel</span><textarea name="goals" rows="2" maxlength="300"></textarea></label>
        <label><span>Omijamy tematy</span><textarea name="avoid_topics" rows="2"></textarea><small>oddziel przecinkami</small></label>
        <label><span>Poprawiaj mnie</span>
          <select name="correction_style">
            <option value="gentle">łagodnie, tylko ważne błędy</option>
            <option value="strict">dokładnie, każdy błąd</option>
          </select>
        </label>
        <label><span>Rozpoznawanie mowy</span>
          <select name="speech_language">
            <option value="auto">automatycznie (rozpoznaje też polskie słowa)</option>
            <option value="en">zawsze po angielsku (przy mocnym akcencie)</option>
          </select>
        </label>
        <div class="row">
          <button type="submit">Zapisz</button>
          <button id="cancel-profile" class="link" type="button">anuluj</button>
        </div>
      </form>
    </section>

    <section id="chat-view" hidden>
      <div class="chat-head">
        <h2>Temat: <span id="chat-topic"></span></h2>
        <div class="row">
          <button id="new-session" class="link" type="button">nowa rozmowa</button>
          <button id="end-session" type="button">zakończ sesję</button>
        </div>
      </div>
      <div id="transcript" class="transcript"></div>
      <p id="status" class="status" hidden></p>
      <div class="answer">
        <div class="voice">
          <button id="mic" class="mic" type="button"><span class="dot"></span><span id="mic-label"></span></button>
          <span class="hint">albo trzymaj spację</span>
          <button id="repeat" class="link" type="button" hidden>powtórz</button>
          <button id="slower" class="link" type="button" hidden>wolniej</button>
        </div>
        <form id="text-form" class="row">
          <input id="text" placeholder="albo napisz po angielsku" maxlength="1000" autocomplete="off" required>
          <button type="submit" class="link">wyślij</button>
        </form>
      </div>
    </section>
    <section id="summary-view" hidden>
      <div class="chat-head">
        <h2>Podsumowanie</h2>
        <button id="summary-new" class="link" type="button">nowa rozmowa</button>
      </div>
      <p id="summary-duration" class="status"></p>
      <p id="summary-empty" hidden>Rozmowa była za krótka na podsumowanie. Następnym razem powiedz coś więcej!</p>
      <div id="summary-content">
        <div><h3>Do poprawy</h3><div id="summary-corrections"></div></div>
        <div><h3>Warte zapamiętania</h3><ul id="summary-vocabulary"></ul></div>
        <div><h3>Dobrze ci idzie</h3><ul id="summary-strengths"></ul></div>
        <div><h3>Na następny raz</h3><p id="summary-tip"></p></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
